services:
  - type: web
    name: qualiflow-copilot-poc
    runtime: python
    plan: free
    rootDir: apps/api
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --bind 0.0.0.0:$PORT src.server:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: FLASK_ENV
        value: production
      - key: GITHUB_OAUTH_CLIENT_ID
        sync: false
      - key: GITHUB_OAUTH_CLIENT_SECRET
        sync: false
      - key: GITHUB_OAUTH_REDIRECT_URI
        sync: false
      - key: GITHUB_OAUTH_SCOPES
        value: read:user user:email
      - key: OAUTH_STATE_SECRET
        sync: false
      - key: AUTH_STATE_TTL_MS
        value: 600000
      - key: AUTH_SESSION_TTL_MS
        value: 28800000
      - key: AZURE_AD_CLIENT_ID
        sync: false
      - key: AZURE_AD_CLIENT_SECRET
        sync: false
      - key: AZURE_AD_TENANT_ID
        value: organizations
      - key: AZURE_AD_REDIRECT_URI
        sync: false
      - key: ATLASSIAN_CLIENT_ID
        sync: false
      - key: ATLASSIAN_CLIENT_SECRET
        sync: false
      - key: ATLASSIAN_REDIRECT_URI
        sync: false
      - key: COPILOT_MODEL
        value: claude-sonnet-4.5
      - key: COPILOT_MODEL_FALLBACKS
        value: gpt-5-mini,claude-opus-4.5
      - key: COPILOT_REQUEST_TIMEOUT_MS
        value: 120000
